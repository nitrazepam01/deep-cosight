[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosight-control-skill"
version = "0.1.0"
description = "Deterministic control-system analysis, design, simulation, and verification tools for Co-Sight"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Co-Sight Control Skill Contributors" }]
dependencies = [
  "control==0.10.2",
  "scipy==1.15.3",
  "numpy==2.2.6; python_version == '3.10'",
  "numpy==2.3.4; python_version >= '3.11'",
  "matplotlib==3.10.8",
  "pydantic>=2.10,<3",
  "Pint==0.24.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
cosight-control = "cosight_control_skill.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosight_control_skill = ["backend_scripts/*.m", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
